# /etc/nginx/sites-available/essentechs.com

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name essentechs.com www.essentechs.com;
    return 301 https://$host$request_uri;
}

# Production HTTPS with HTTP/2 and modern security & caching headers
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name essentechs.com www.essentechs.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/essentechs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essentechs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/essentechs/public;
    index index.php index.html;

    charset utf-8;

    # Security Headers for 100/100 Best Practices
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip compression for faster page loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff font/woff2 application/vnd.ms-fontobject;
    gzip_vary on;

    # Upload file size limit for admin banners & images
    client_max_body_size 20M;

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets aggressive caching (1 year immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM Handler (PHP 8.3)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
